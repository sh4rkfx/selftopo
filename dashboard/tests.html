<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#e8eae4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0b0a" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>selftopo · Tests</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Test report of the selftopo code: one run of the test suite, read from results.json and
   history.json on the branch test-results (written by the Tests workflow), or from
   ../test-results/ after a local pytest run. Same design tokens as the dashboard. */
:root {
  --page: #e8eae4; --area: #f4f5f1; --surface: #fdfdfb; --bar: rgba(232, 234, 228, 0.88);
  --ink: #0b0b0b; --ink-2: #4f4e4a; --muted: #74736c; --grid: #e4e3dc; --axis: #c0bfb4;
  --ring: rgba(11, 11, 11, 0.09); --ring-strong: rgba(11, 11, 11, 0.24);
  --s1: #2a78d6; --other: #a9a79f;
  --good: #0ca30c; --warn: #fab219; --crit: #d03b3b;
  --pill-good: rgba(12, 163, 12, 0.12); --pill-warn: rgba(250, 178, 25, 0.22); --pill-crit: rgba(208, 59, 59, 0.13);
  --note: #fff4d6; --chip: #eceae3;
  --good-ink: #17722f; --warn-ink: #805300; --crit-ink: #a8231b;
  --font-sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #0a0b0a; --area: #131412; --surface: #1c1d1b; --bar: rgba(10, 11, 10, 0.86);
    --ink: #f0efec; --ink-2: #c3c2b7; --muted: #9a9890; --grid: #2c2c2a; --axis: #45453f;
    --ring: rgba(255, 255, 255, 0.09); --ring-strong: rgba(255, 255, 255, 0.24);
    --s1: #3987e5; --other: #66655f;
    --pill-good: rgba(12, 163, 12, 0.20); --pill-warn: rgba(250, 178, 25, 0.18); --pill-crit: rgba(208, 59, 59, 0.24);
    --note: #2a2414; --chip: #2a2a27;
    --good-ink: #74d37f; --warn-ink: #f2c35b; --crit-ink: #f29086;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #0a0b0a; --area: #131412; --surface: #1c1d1b; --bar: rgba(10, 11, 10, 0.86);
  --ink: #f0efec; --ink-2: #c3c2b7; --muted: #9a9890; --grid: #2c2c2a; --axis: #45453f;
  --ring: rgba(255, 255, 255, 0.09); --ring-strong: rgba(255, 255, 255, 0.24);
  --s1: #3987e5; --other: #66655f;
  --pill-good: rgba(12, 163, 12, 0.20); --pill-warn: rgba(250, 178, 25, 0.18); --pill-crit: rgba(208, 59, 59, 0.24);
  --note: #2a2414; --chip: #2a2a27;
  --good-ink: #74d37f; --warn-ink: #f2c35b; --crit-ink: #f29086;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-padding-top: 72px; }
body { margin: 0; background: var(--page); color: var(--ink); font-family: var(--font-sans); font-size: 14px; line-height: 1.45; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h1 { font-size: 26px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.2; }
h2 { font-size: 19px; font-weight: 600; letter-spacing: -0.005em; line-height: 1.25; }
h3 { font-size: 14px; font-weight: 600; }
p { margin: 0; }
a { color: inherit; }
button, input, select { font: inherit; color: inherit; }
code, .mono { font-family: var(--font-mono); font-size: 12px; }
:focus-visible { outline: 2px solid var(--s1); outline-offset: 2px; border-radius: 4px; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.sub { color: var(--ink-2); font-size: 13px; }
.muted { color: var(--muted); }

.bar { position: sticky; top: 0; z-index: 5; background: var(--bar); border-bottom: 1px solid var(--ring);
  -webkit-backdrop-filter: saturate(1.3) blur(10px); backdrop-filter: saturate(1.3) blur(10px);
  padding-top: env(safe-area-inset-top, 0px); }
.bar-in { max-width: 1240px; margin: 0 auto; padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px));
  display: flex; align-items: center; gap: 12px; }
.brand { font-family: var(--font-mono); font-size: 12px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; text-decoration: none; padding: 6px 4px; display: inline-flex; gap: 6px; align-items: center; }
.bar .spacer { flex: 1; }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--ring); border-radius: 8px; padding: 3px; gap: 2px; }
.seg button { font-size: 12px; color: var(--ink-2); background: transparent; border: 0; padding: 4px 9px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
.seg button:hover { background: var(--grid); color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); font-weight: 500; }

.wrap { max-width: 1240px; margin: 0 auto; padding: 22px max(16px, env(safe-area-inset-right, 0px)) calc(56px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
.top { display: grid; gap: 6px; }
.status-line { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; color: var(--ink-2); font-size: 13px; }
.status-line a { text-underline-offset: 2px; }
.card { background: var(--surface); border: 1px solid var(--ring); border-radius: 12px; padding: 14px 16px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.notice { background: var(--note); border: 1px solid var(--ring); border-radius: 10px; padding: 10px 14px; font-size: 13px; color: var(--ink-2); display: grid; gap: 4px; }
.notice strong { color: var(--ink); }

/* Overall traffic light */
.hero { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 900px) { .hero { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); align-items: start; } }
.verdict { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 14px; align-items: center; }
.lamp { grid-row: span 2; width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 24px; font-weight: 700;
  box-shadow: inset 0 0 0 4px rgba(255, 255, 255, 0.25); }
.lamp.green { background: var(--good); } .lamp.yellow { background: var(--warn); color: #3a2a00; } .lamp.red { background: var(--crit); }
.verdict h2 { font-size: 22px; }
.verdict .sub { grid-column: 2; }
.lights { display: inline-flex; gap: 5px; padding: 5px 7px; background: #1b1c1a; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.1); border-radius: 999px; vertical-align: middle; }
.lights i { width: 10px; height: 10px; border-radius: 50%; background: rgba(255, 255, 255, 0.16); }
.lights i.on.red { background: var(--crit); } .lights i.on.yellow { background: var(--warn); } .lights i.on.green { background: var(--good); }
.counts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border: 1px solid var(--ring); border-radius: 10px; overflow: hidden; background: var(--surface); }
@media (min-width: 560px) { .counts { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.count { padding: 10px 12px; display: grid; gap: 1px; border-right: 1px solid var(--ring); border-bottom: 1px solid var(--ring); margin: 0 -1px -1px 0; min-width: 0; }
.count .label { font-size: 12px; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
.count .value { font-size: 24px; font-weight: 600; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; line-height: 1.2; }
.count .value small { font-size: 13px; font-weight: 400; color: var(--ink-2); margin-left: 2px; }
.count .note { font-size: 12px; color: var(--muted); }
.stack { display: flex; height: 8px; border-radius: 99px; overflow: hidden; background: var(--grid); }
.stack span { display: block; height: 100%; }
.stack .green { background: var(--good); } .stack .red { background: var(--crit); } .stack .yellow { background: var(--warn); }
.failing-list { display: grid; gap: 4px; margin: 0; padding: 0; list-style: none; }
.failing-list a { text-underline-offset: 2px; }

/* Status markers: color plus symbol, never color alone */
.dot { width: 18px; height: 18px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 11px; font-weight: 700; color: #fff; line-height: 1; flex: none; }
.dot.green { background: var(--good); } .dot.red { background: var(--crit); } .dot.yellow { background: var(--warn); color: #3a2a00; } .dot.gray { background: var(--other); }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px 1px 3px; border-radius: 999px; font-size: 12px; font-weight: 500; white-space: nowrap; }
.pill .dot { width: 15px; height: 15px; font-size: 10px; }
.pill.green { background: var(--pill-good); color: var(--good-ink); } .pill.red { background: var(--pill-crit); color: var(--crit-ink); }
.pill.yellow { background: var(--pill-warn); color: var(--warn-ink); } .pill.gray { background: var(--grid); color: var(--ink-2); }
.badge { display: inline-flex; align-items: center; padding: 0 7px; border-radius: 999px; font-size: 11px; font-weight: 500; border: 1px solid var(--ring-strong); color: var(--ink-2); white-space: nowrap; line-height: 18px; }
.badge.crit { border-color: transparent; background: var(--ink); color: var(--surface); }
.badge.new { border-color: transparent; background: var(--chip); }

/* History */
.runs { display: flex; gap: 3px; align-items: flex-end; flex-wrap: wrap; }
.runs a, .runs span { width: 16px; height: 22px; border-radius: 4px; display: block; text-decoration: none; }
.runs .green { background: var(--good); } .runs .yellow { background: var(--warn); } .runs .red { background: var(--crit); } .runs .gray { background: var(--other); }
.runs .current { outline: 2px solid var(--ink); outline-offset: 1px; }
.minihist { display: inline-flex; gap: 2px; align-items: center; }
.minihist i { width: 5px; height: 12px; border-radius: 1.5px; background: var(--grid); }
.minihist i.green { background: var(--good); } .minihist i.yellow { background: var(--warn); } .minihist i.red { background: var(--crit); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink-2); }

/* Notes: new, removed, flaky, slower, slowest */
.notes { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 900px) { .notes { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (min-width: 1180px) { .notes { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.note-list { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.note-list li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: baseline; font-size: 13px; }
.note-list .meta { font-size: 12px; color: var(--muted); grid-column: 1 / -1; }
.bar-row { display: grid; grid-template-columns: minmax(0, 1fr) 64px; gap: 2px 10px; align-items: center; font-size: 13px; }
.bar-row .track { grid-column: 1 / -1; height: 6px; border-radius: 99px; background: var(--grid); overflow: hidden; }
.bar-row .track span { display: block; height: 100%; background: var(--s1); border-radius: 99px; }
.bar-row .num { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.bar-row a { text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-row a:hover { text-decoration: underline; }

/* Toolbar */
.toolbar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; position: sticky; top: calc(49px + env(safe-area-inset-top, 0px)); z-index: 4;
  background: var(--page); padding: 8px 0; margin: -8px 0; }
.toolbar .search { flex: 1 1 200px; min-width: 0; display: flex; }
.toolbar .seg { max-width: 100%; overflow-x: auto; scrollbar-width: none; }
@media (max-width: 640px) { .toolbar { position: static; margin: 0; padding: 0; } }
.toolbar input[type="search"] { width: 100%; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--ring-strong); background: var(--surface); font-size: 13px; }
.toolbar label.check { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); cursor: pointer; }
.toolbar select { padding: 5px 8px; border-radius: 8px; border: 1px solid var(--ring-strong); background: var(--surface); font-size: 13px; }
.ghost-btn { font-size: 12.5px; color: var(--ink-2); background: transparent; border: 1px solid var(--ring-strong); border-radius: 7px; padding: 5px 10px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
.ghost-btn:hover { color: var(--ink); border-color: var(--ink); }

/* Groups and tests */
.group { background: var(--area); border: 1px solid var(--ring); border-radius: 14px; padding: 12px; display: grid; gap: 8px; }
.group-head { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; padding: 2px 4px; }
.group-head .sub { grid-column: 2 / -1; }
.group-head .file { grid-column: 2 / -1; font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); }
.group-head .tally { font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tests { display: grid; gap: 6px; }
details.test { background: var(--surface); border: 1px solid var(--ring); border-radius: 10px; min-width: 0; }
details.test.red { border-color: color-mix(in srgb, var(--crit) 45%, transparent); }
details.test[open] { box-shadow: 0 1px 0 var(--ring); }
details.test > summary { list-style: none; cursor: pointer; padding: 9px 12px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; border-radius: 10px; }
details.test > summary::-webkit-details-marker { display: none; }
details.test > summary:hover { background: var(--area); }
.t-title { font-weight: 500; min-width: 0; overflow-wrap: anywhere; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
.t-meta { display: flex; gap: 10px; align-items: center; font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.t-sub { grid-column: 2 / -1; font-size: 12.5px; color: var(--ink-2); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.t-sub.err { color: var(--crit-ink); white-space: normal; overflow-wrap: anywhere; }
details.test[open] > summary .t-sub:not(.err) { display: none; } /* the description follows below */
.chev { width: 16px; height: 16px; transition: transform 0.15s ease; color: var(--muted); }
details.test[open] .chev { transform: rotate(180deg); }
@media (max-width: 640px) {
  details.test > summary { grid-template-columns: auto minmax(0, 1fr); }
  .t-meta { grid-column: 2; }
  .t-meta .minihist { display: none; }
}
.t-body { padding: 4px 14px 14px 40px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; min-width: 0; }
.t-body > * { min-width: 0; }
@media (max-width: 640px) { .t-body { padding-left: 14px; } }
.t-body h4 { margin: 0 0 4px; font-size: 11.5px; font-weight: 500; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); font-family: var(--font-mono); }
.t-doc p + p { margin-top: 6px; }
.t-doc { max-width: 80ch; }
pre.val { margin: 0; font-family: var(--font-mono); font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 11em; overflow: auto;
  background: var(--area); border: 1px solid var(--ring); border-radius: 6px; padding: 5px 8px; }
.inputs { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 12px; margin: 0; align-items: start; }
.inputs dt { font-family: var(--font-mono); font-size: 12px; color: var(--ink-2); padding-top: 5px; }
.inputs dd { margin: 0; min-width: 0; }
@media (max-width: 640px) { .inputs { grid-template-columns: minmax(0, 1fr); gap: 2px; } .inputs dd { margin-bottom: 6px; } }

.checks { display: grid; gap: 0; border: 1px solid var(--ring); border-radius: 8px; overflow: hidden; }
.check { display: grid; grid-template-columns: 22px minmax(0, 1.25fr) minmax(0, 1fr) minmax(0, 1fr); gap: 4px 12px; padding: 8px 10px; border-top: 1px solid var(--ring); align-items: start; min-width: 0; }
.check:first-child { border-top: 0; }
.check.head { background: var(--area); font-size: 11.5px; color: var(--muted); padding-block: 5px; }
.check.bad { background: var(--pill-crit); }
.check.skip { color: var(--muted); }
.check .expr code { white-space: pre-wrap; overflow-wrap: anywhere; display: block; }
.check .line { font-size: 11.5px; color: var(--muted); text-decoration: none; }
.check .line:hover { text-decoration: underline; }
.check .detail { font-size: 11.5px; color: var(--muted); font-family: var(--font-mono); white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 4px; }
.check .cell-label { display: none; font-size: 11px; color: var(--muted); }
@media (max-width: 760px) {
  .check { grid-template-columns: 22px minmax(0, 1fr); }
  .check.head { display: none; }
  .check > .exp, .check > .act { grid-column: 2; }
  .check .cell-label { display: block; }
}
.message { background: var(--pill-crit); border-radius: 8px; padding: 8px 10px; font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; font-family: var(--font-mono); font-size: 12px; max-height: 16em; overflow: auto; }
.message.yellow { background: var(--pill-warn); }
details.trace > summary { cursor: pointer; font-size: 12.5px; color: var(--ink-2); }
details.trace pre { margin: 6px 0 0; font-family: var(--font-mono); font-size: 11.5px; white-space: pre; overflow: auto; max-height: 28em;
  background: var(--area); border: 1px solid var(--ring); border-radius: 6px; padding: 8px 10px; }
.facts { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12.5px; color: var(--ink-2); align-items: center; }
.facts a { text-underline-offset: 2px; }
.empty { padding: 28px 16px; text-align: center; color: var(--ink-2); }
.info-table { border-collapse: collapse; font-size: 12.5px; max-width: 80ch; }
.info-table th, .info-table td { text-align: left; vertical-align: top; padding: 6px 12px 6px 0; border-bottom: 1px solid var(--ring); }
.info-table th { font-size: 11.5px; color: var(--muted); font-weight: 500; }
.info-table td:first-child { white-space: nowrap; }
details.rules > summary { cursor: pointer; font-size: 12.5px; color: var(--ink-2); width: max-content; }
details.rules[open] > summary { margin-bottom: 8px; }
footer { color: var(--muted); font-size: 12px; display: flex; flex-wrap: wrap; gap: 6px 14px; }
footer a { color: var(--ink-2); text-underline-offset: 2px; }
.flash { animation: flash 1.6s ease-out 1; }
@keyframes flash { 0% { box-shadow: 0 0 0 3px var(--s1); } 100% { box-shadow: 0 0 0 3px transparent; } }
@media (prefers-reduced-motion: reduce) { .flash { animation: none; } .chev { transition: none; } }
</style>
</head>
<body>
<header class="bar"><div class="bar-in">
  <a class="brand" href="./" id="back"></a>
  <span class="spacer"></span>
  <div class="seg" role="group" id="lang-switch">
    <button type="button" data-lang="de">DE</button>
    <button type="button" data-lang="en">EN</button>
  </div>
</div></header>
<main class="wrap" id="main" aria-busy="true">
  <p class="sub" id="loading"></p>
</main>

<script>
"use strict";
(() => {
  // ------------------------------------------------------------------ language
  // German is the source text, as in the dashboard; EN holds the English texts.
  const LANG_KEY = "selftopo.lang";
  const params = new URLSearchParams(location.search);
  function pickLanguage() {
    const asked = params.get("lang");
    if (asked === "de" || asked === "en") return asked;
    try {
      const saved = localStorage.getItem(LANG_KEY);
      if (saved === "de" || saved === "en") return saved;
    } catch { /* storage unavailable */ }
    const first = (navigator.languages && navigator.languages[0]) || navigator.language || "de";
    return /^de\b/i.test(first) ? "de" : "en";
  }
  const LANG = pickLanguage();
  const LOCALE = LANG === "de" ? "de-DE" : "en-GB";
  const DATE_LOCALE = LANG === "de" ? "de-AT" : "en-GB";
  document.documentElement.lang = LANG;
  const EN = {
    "Dashboard": "Dashboard",
    "Testergebnisse": "Test results",
    "Tests der selftopo-Software": "Tests of the selftopo software",
    "Lade Testergebnisse …": "Loading test results …",
    "Noch keine Testergebnisse": "No test results yet",
    "Der Workflow Tests veröffentlicht sie nach jedem Push auf main im Branch test-results. Lokal: pytest ausführen, dann python -m http.server 8000 im Repository und diese Seite unter localhost:8000/dashboard/tests.html öffnen.":
      "The Tests workflow publishes them to the branch test-results after every push to main. Locally: run pytest, then python -m http.server 8000 in the repository and open this page at localhost:8000/dashboard/tests.html.",
    "Gesucht in: {0}": "Looked in: {0}",
    "Commit {0}": "Commit {0}",
    "Lauf auf GitHub": "Run on GitHub",
    "lokaler Lauf": "local run",

  function opText(check) {
    const L = check.left, R = check.right;

      case "!=": return [`≠ ${R}`, L];
      case "<": case "<=": case ">": case ">=": return [`${{ "<": "<", "<=": "≤", ">": ">", ">=": "≥" }[check.op]} ${R}`, L];
      case "is": return [T("ist {0}", [R]), L];
      case "is not": return [T("ist nicht {0}", [R]), L];
      case "in": return [T("enthält {0}", [L]), R];
      case "not in": return [T("enthält nicht {0}", [L]), R];
      case "truthy": return [T("wahr oder nicht leer"), L];
      case "falsy": return [T("falsch oder leer"), L];

  function fillBody(details) {

    STATE.analysis = analyse(results, runs);
    const light = results.summary?.light || "gray";
    document.title = `${{ green: "🟢", yellow: "🟡", red: "🔴" }[light] || ""} selftopo · Tests`;
    $("main").replaceChildren(renderTop(), renderHero(), renderHistory(), renderNotes(), renderToolbar(), h("div", { id: "list", style: "display:grid;gap:12px" }), renderFooter());
    renderList();
    const hash = decodeURIComponent(location.hash.replace(/^#t=/, ""));
    if (location.hash.startsWith("#t=") && STATE.byId.has(hash)) openTest(hash, true);
    window.selftopoTests = STATE;  // for debugging in the console
  }
  main();
})();
</script>
</body>
</html>
