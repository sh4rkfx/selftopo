[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Records passing asserts for the test report (tests/report_plugin.py, dashboard/tests.html)
enable_assertion_pass_hook = true
report_json = "test-results/results.json"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]
