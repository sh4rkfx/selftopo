# Moves the major version tag (v1, v2, …) to every published release, so data repositories that
# check out "v1" get the newest 1.x release with their next run.
name: Move major tag

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Point the major tag at this release
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          major="${TAG%%.*}"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Not a release version: $TAG"
            exit 0
          fi
          git tag -f "$major" HEAD
          git push -f origin "refs/tags/$major"
          echo "$major now points to $TAG"
